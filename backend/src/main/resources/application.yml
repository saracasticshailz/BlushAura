server:
  address: 127.0.0.1
  port: ${PORT:8081}
  servlet:
    session:
      timeout: 30m
      cookie:
        http-only: true
        same-site: lax
  error:
    include-message: never
    include-stacktrace: never
spring:
  config:
    import: optional:file:./.local/database.properties
  application:
    name: blush-aura-api
  datasource:
    url: ${DB_URL:jdbc:postgresql://127.0.0.1:55432/blushaura}
    username: ${DB_USER:blushaura}
    password: ${DB_PASSWORD:}
  flyway:
    enabled: true
  jackson:
    deserialization:
      fail-on-unknown-properties: true
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 21MB
